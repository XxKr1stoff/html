<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pizzeria</title>
    <link rel="icon" href="./assets/logo.png?" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <nav id="sidebar">
      <button class="sideButton">
        <p>Pizzas</p>
      </button>
      <button class="sideButton">
        <p>Pastas</p>
      </button>
      <button class="sideButton">Drinks</button>
    </nav>
    <nav id="mainContent">
      <div class="top">Popular Offers</div>
      <div id="offers">
        <button class="popularOffer">
          <img class="FoodImg" src="./assets/peperoni.png" />
          <div class="FoodName">
            <h4>Pizza peperoni</h4>
            <h5>small-5$</h5>
            <h5>medium-7.5$</h5>
            <h5>large-10$</h5>
          </div>
        </button>

        <button class="popularOffer">
          <img class="FoodImg" src="./assets/margherita.png" />
          <div class="FoodName">
            <h4>Pizza margherita</h4>
            <h5>small-5$</h5>
            <h5>medium-7.5$</h5>
            <h5>large-10$</h5>
          </div>
        </button>

        <button class="popularOffer">
          <img class="FoodImg" src="./assets/bolognese.png" />
          <div class="FoodName">
            <h4>Spaghetti bolognese</h4>
            <h5>regular-7.5$</h5>
          </div>
        </button>
      </div>

      <div class="top">Seasonal Offers</div>
      <div id="seasonalOffers">
        <button class="seasonalOffer">
          <img class="FoodImg" src="./assets/mushroom.png" />
          <div class="FoodName">
            <h4>Mushroom pizza</h4>
            <h5>small-5$</h5>
            <h5>medium-7.5$</h5>
            <h5>large-10$</h5>
          </div>
        </button>
      </div>
    </nav>
  </body>
</html>
